name: steering-env
channels:
  - defaults
dependencies:
  - python=3.11
  - transformers
  - huggingface_hub
  - ipython
  - pip
  - pip:
    - steering-vectors
    - datasets>=2.14.0
    - pyarrow>=14.0.0
    - matplotlib
    - numpy
    - lighteval
    - matplotlib
    - openai
    - peft
    - latex2sympy2
    - anthropic
    - vllm
prefix: /opt/anaconda3/envs/steering-env
