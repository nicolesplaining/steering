name: steering-env
channels:
  - defaults
dependencies:
  - python=3.11
  - transformers
  - huggingface_hub
  - ipython
  - pip
  - pip:
    - steering-vectors
    - datasets>=2.14.0
    - pyarrow>=14.0.0
    - matplotlib
    - numpy
    - lighteval
    - matplotlib
    - openai
    - peft
    # For baseline_eval/evaluate_distilled_math --no-llm-judge (symbolic math matching)
    - latex2sympy2
    # For context_distillation.py with --teacher anthropic (default)
    - anthropic
prefix: /opt/anaconda3/envs/steering-env
